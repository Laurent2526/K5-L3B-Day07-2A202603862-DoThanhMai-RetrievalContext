# Optional isolated reproduction database; original Day 6 database is untouched.
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_DB: day7_reproduction
      POSTGRES_USER: day7
      POSTGRES_PASSWORD: day7_local_only
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - pg_day7_reproduction:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U day7 -d day7_reproduction"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  pg_day7_reproduction:
